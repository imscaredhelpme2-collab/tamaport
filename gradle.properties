org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Toolchain versions (edit ONLY here) -------------------------------------------------------------
# Defaults match Code on the Go release 26.37 and earlier (Gradle 8.14.3):
agpVersion=8.11.0
kotlinVersion=1.9.22
# NDK: leave as 'auto' to use the newest installed one, or name a specific installed version.
ndkVersion=auto
# Preferred SDK platform; if it is not installed the newest installed platform (33 or higher) is used.
compileSdkVer=35
targetSdkVer=35
# Native CPU types to build. arm64-v8a is all a modern tablet needs (fastest build).
# For an emulator add: arm64-v8a,x86_64
abis=arm64-v8a
#
# Code on the Go 26.38 or newer (Gradle 9.6.1) uses:  agpVersion=9.3.1  kotlinVersion=2.3.21
# and needs the two small edits listed in README.md ("If your Code on the Go is newer").
# ------------------------------------------------------------------------------------------------------
